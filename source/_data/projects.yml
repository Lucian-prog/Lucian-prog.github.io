# ============================================================
# 项目矩阵数据源（Project Matrix）
# 用途：/projects/ 可视化页面的单一数据源
# 流程：本文件（手维护）→ Actions 合成 GitHub 元数据
#       → source/data/projects.json（自动生成，勿手改）
# 新增字段：前端按 schema 渲染，加字段即生效
#
# 字段说明：
#   id        唯一标识（英文）
#   name      项目名
#   subtitle  一句话定位
#   group     分组：主编队 / 工程实践 / 学习演练（筛选 tab）
#   status    spec | rtl | sim-pass | fpga-pass | frozen | active
#   stage     五门进度 1~5（定义/实现/验证/上板/归档）
#   metrics   指标 chips（数组）
#   stack     技术栈标签（数组）
#   repo      GitHub 仓库名（owner/name，留空则不拉元数据）
#   repo_path 仓库内子路径（拼接到链接）
#   highlight 亮点行（奖项/论文等，可省略）
# ============================================================

meta:
  title: "项目矩阵 · Project Matrix"
  description: "数字 IC 前端学习与工程实践的全景看板"

stages: ["定义", "实现", "验证", "上板", "归档"]

